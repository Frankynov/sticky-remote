# Wi-Fi mode "setup": no network compiled in. The Sticky opens its setup
# hotspot straight away; the network chosen there is saved on the device.
# Selected by the wifi_mode substitution (Prepare & Flash › Wi-Fi).
wifi:
  reboot_timeout: 0s
  # A remote answers taps: no modem sleep (ESPHome's ESP32 default), which
  # holds packets back for tens of ms at a time and bunches them up.
  power_save_mode: none
  ap:
    # Open (no password), as most ESP devices do: it only runs while the
    # Sticky can't connect, and its screen shows how to join it.
    ssid: ${setup_ssid}
    ap_timeout: 30s
