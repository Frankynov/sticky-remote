# =============================================================================
# Sticky Remote: a media-player remote + one or two light tiles for the
# reTerminal Sticky (ESP32-S3R8, 3.97" 800x480 SSD1677 e-paper, GT911 touch).
#
# Everything goes through Home Assistant. What the Sticky controls is a set of
# settings stored on the device (sticky_device.h): the substitutions below are
# only their defaults. A setup tool (the web wizard, Sticky Simulator) sends
# real settings over USB; sticky-remote-generic.yaml builds the one firmware
# everyone can flash, with empty defaults.
# UI: portrait 480x800, pure black/white. Drawing, hit-testing and state live
# in remote_ui.h (shared with the simulator).
#
# NOT YET TESTED ON HARDWARE. First things to check on the real device are
# listed in README.md (rotation, touch axes, sleep/wake).
# =============================================================================

substitutions:
  device_name: sticky-remote
  friendly_name: Sticky Remote
  # "true" appends the MAC's last bytes to the name (sticky-remote-a1b2c3), so
  # several Stickies can live in one home. The generic firmware sets it.
  name_add_mac_suffix: "false"
  firmware_version: "0.6.3"

  # --- Defaults for the device settings (overridden by settings sent over USB)
  room_name: Living room
  # Home Assistant base URL, used to fetch the artwork (entity_picture is a
  # relative /api/media_player_proxy/... path that carries its own token).
  ha_base_url: http://homeassistant.local:8123
  apple_tv: media_player.living_room
  apple_tv_remote: remote.living_room
  player_name: Apple TV
  infuse_source: Infuse
  infuse_label: Open Infuse
  light_1: light.floor_lamp
  light_1_name: Floor lamp
  light_1_icon: floor         # bulb, ceiling, floor or star
  light_2: light.ceiling      # empty: a single light tile
  light_2_name: Ceiling
  light_2_icon: ceiling
  font_set: inter             # inter or trmnl (both are built in)

  # Where the "Finish setup" screen sends people.
  setup_url: sticky-remote setup page

  # Portrait. If the picture is upside down on the device, use 270 instead.
  rotation: "90"
  # ESPHome's touch transform; only used when touch_map is empty.
  touch_swap_xy: "false"
  touch_mirror_x: "false"
  touch_mirror_y: "false"
  # Raw GT911 -> screen map used until a calibration is saved: "ax,bx,cx,ay,by,cy"
  # for x = ax*rx + bx*ry + cx, y = ay*rx + by*ry + cy. Measured on a real
  # Sticky (2026-11-07): the chip reports portrait with y reversed. Empty = use
  # the touch_* transform above.
  touch_map: "1,0,0,0,-1,799"
  # Development only: "true" enables the touch calibration screen (hold Down
  # 3 s, or the USB "calibrate" command) and uses a calibration saved on the
  # device instead of touch_map. Keep "false" in released firmware.
  touch_calibration: "false"

  # Experimental: four grey levels for the artwork (display-grayscale-true.yaml).
  # Full refreshes use the panel's 4-level waveform; any partial one (a tap, the
  # minute tick) turns the whole panel back to black and white until the next
  # full refresh, so the greys come and go.
  grayscale: "false"

  # Wi-Fi: "builtin" (network from secrets.yaml) or "setup" (none until the
  # setup page sends one over USB). See wifi-builtin.yaml / wifi-setup.yaml.
  wifi_mode: builtin

  # Over-the-air updates: empty means no password (the generic firmware).
  ota_password: ""

  # How long before it sleeps on battery is a device setting ("Sleep after":
  # 1, 3, 10 or 30 minutes, or never), 3 minutes by default; on USB it stays awake.
  # During setup (no Wi-Fi, not configured, or not yet added to HA).
  setup_sleep_after_ms: "600000"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: ${name_add_mac_suffix}
  project:
    name: fgilbert.sticky-remote
    version: ${firmware_version}
  includes:
    - remote_ui.h
    - sticky_device.h
  on_boot:
    # The power latch must be re-asserted before anything else, or the
    # device switches itself off a moment after the button is released.
    - priority: 600
      then:
        - output.turn_on: pwr_hold
        - output.turn_on: pwr_lock
        # BQ25616 charge enable is active low: "on" drives the pin LOW.
        - output.turn_on: charge_enable
        # Deselect the microSD card that shares the panel's SPI bus.
        - output.turn_on: sd_cs_idle
        - lambda: |-
            remote_ui::release_sleep_holds();
            id(last_activity) = millis();
            id(last_online) = millis();
            remote_ui::request(true);
            // Settings: the YAML's values are defaults; stored ones (sent over USB) win.
            auto &d = sticky::defaults();
            d.player = "${apple_tv}";
            d.remote = "${apple_tv_remote}";
            d.player_name = "${player_name}";
            d.app = "${infuse_source}";
            d.app_label = "${infuse_label}";
            d.light1 = "${light_1}";
            d.light1_name = "${light_1_name}";
            d.light1_icon = "${light_1_icon}";
            d.light2 = "${light_2}";
            d.light2_name = "${light_2_name}";
            d.light2_icon = "${light_2_icon}";
            d.room = "${room_name}";
            d.ha_url = "${ha_base_url}";
            d.font_set = "${font_set}";
            sticky::load();
            remote_ui::calibration_enabled() = ${touch_calibration};
            sticky::set_default_touch_cal("${touch_map}");
            sticky::load_touch_cal();
            sticky::load_sound();
            sticky::load_sleep();
            sticky::load_clock();
            sticky::keep_scan_results();
            sticky::restore_wifi();   // before Wi-Fi starts (its setup runs later)
            sticky::apply_to_ui();
            sticky::poster() = id(poster);
            // Subscribe to the chosen entities before the API connects.
            sticky::subscribe(api::global_api_server);
            // Bridge from the shared input code (remote_ui.h) to the HA scripts below.
            struct EspActions : remote_ui::Actions {
              void click() override { id(beep).execute(); }
              void toggle_light(int i) override {
                if (i == 0) id(toggle_light_1).execute(); else id(toggle_light_2).execute();
              }
              void atv_power(bool on) override {
                if (on) id(atv_turn_on).execute(); else id(atv_turn_off).execute();
              }
              void play_pause() override { id(atv_play_pause).execute(); }
              void seek(float s) override { id(atv_seek).execute(s); }
              void remote_command(const char *c) override { id(atv_remote).execute(std::string(c)); }
              void volume(bool up) override {
                if (up) id(atv_volume_up).execute(); else id(atv_volume_down).execute();
              }
              void open_infuse() override { id(atv_open_infuse).execute(); }
              void save_touch_cal(const remote_ui::TouchCal &c) override { sticky::save_touch_cal(c); }
              void sleep() override { id(go_to_sleep).execute(); }
            };
            static EspActions esp_actions;
            remote_ui::actions() = &esp_actions;
    # After setup: what the setup screens show.
    - priority: -100
      then:
        - lambda: |-
            remote_ui::set_device_name(App.get_name().c_str());
            remote_ui::apply("setup_url", "${setup_url}");
            remote_ui::set_ha_paired(id(ha_paired));
            sticky::unpair_hook() = []() { id(ha_paired) = false; };
            // Announce ourselves on the USB line for setup tools.
            sticky::send_line(sticky::info("hello"));

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      # Required by ESPHome for OTA on 32 MB flash.
      enable_idf_experimental_features: true

psram:
  mode: octal
  speed: 80MHz

# Serial goes through the CH343 USB-UART bridge, not native USB.
logger:
  hardware_uart: UART0

# Wi-Fi: wifi-builtin.yaml (network from secrets.yaml) or wifi-setup.yaml
# (none compiled in). Either way the network sent over USB by the setup page
# is saved on the device and wins. No hotspot or captive portal: everything
# is set up from the page, and the panel says so when it has no network.
packages:
  wifi: !include wifi-${wifi_mode}.yaml
  grayscale: !include display-grayscale-${grayscale}.yaml

# JSON for the USB setup protocol (sticky_device.h). It replaces Improv: both
# would read the same serial line.
json:

api:
  # No key compiled in: Home Assistant sends one when the Sticky is added, and
  # the Sticky keeps it (only a factory reset removes it). That's what lets
  # one firmware fit every home.
  encryption: {}
  # Never reboot because HA is unreachable: it is a remote, not a server.
  reboot_timeout: 0s
  homeassistant_services: true
  homeassistant_states: true
  on_client_connected:
    - lambda: |-
        remote_ui::model().online = true;
        remote_ui::set_ha_paired(true);
        id(ha_paired) = true;   // remembered: no more "Add to Home Assistant" screen
  on_client_disconnected:
    - lambda: |-
        remote_ui::model().online = false;
        remote_ui::request();

ota:
  - platform: esphome
    password: "${ota_password}"

# Settings shown on the Sticky's device page in Home Assistant.
select:
  # Also set from the setup page; stored by sticky_device.h.
  - platform: template
    id: touch_sound
    name: "Touch sound"
    icon: mdi:volume-high
    entity_category: config
    options: ["Off", "Quiet", "Normal"]
    update_interval: 60s
    lambda: |-
      static const char *const NAMES[] = {"Off", "Quiet", "Normal"};
      return std::string(NAMES[sticky::sound()]);
    set_action:
      - lambda: |-
          sticky::set_sound(x == "Off" ? 0 : x == "Quiet" ? 1 : 2);
          id(touch_sound).publish_state(x);

  - platform: template
    id: sleep_after
    name: "Sleep after"
    icon: mdi:sleep
    entity_category: config
    options: ["1 minute", "3 minutes", "10 minutes", "30 minutes", "Never"]
    update_interval: 60s
    lambda: |-
      static const char *const NAMES[] = {"1 minute", "3 minutes", "10 minutes", "30 minutes", "Never"};
      return std::string(NAMES[sticky::sleep_choice()]);
    set_action:
      - lambda: |-
          static const char *const NAMES[] = {"1 minute", "3 minutes", "10 minutes", "30 minutes", "Never"};
          for (uint8_t i = 0; i < 5; i++)
            if (x == NAMES[i]) sticky::set_sleep(i);
          id(sleep_after).publish_state(x);

time:
  - platform: homeassistant
    id: ha_time

globals:
  # Set once Home Assistant has connected; until then the Sticky shows how to add it.
  - id: ha_paired
    type: bool
    restore_value: true
    initial_value: "false"
  - id: last_activity
    type: uint32_t
  # Clock while asleep: light sleep between minute ticks (sticky::doze).
  - id: dozing
    type: bool
    initial_value: "false"
  # When a button last woke it: that press only wakes it.
  - id: woke_at
    type: uint32_t
  # Last time Wi-Fi was up (or boot, or a wake): "out of reach" after 90 s without.
  - id: last_online
    type: uint32_t
    initial_value: "0"
  - id: last_tap
    type: uint32_t
    initial_value: "0"

# --- Buses ---------------------------------------------------------------------
spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14
  miso_pin: GPIO12

i2c:
  - id: i2c_sensor          # BQ27220 fuel gauge, SHT40, IMU, RTC
    scl: GPIO0
    sda: GPIO1
    frequency: 400kHz
  - id: i2c_touch           # GT911
    scl: GPIO2
    sda: GPIO3
    frequency: 100kHz

# --- Power, charger, buzzer ---------------------------------------------------------
output:
  - platform: gpio
    pin: GPIO45
    id: pwr_hold
  - platform: gpio
    pin: GPIO46
    id: pwr_lock
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    id: charge_enable
  - platform: gpio
    pin: GPIO8
    id: sd_cs_idle
  - platform: ledc
    pin: GPIO48
    id: buzzer
    frequency: 2700Hz

switch:
  - platform: gpio
    pin: GPIO42
    id: touch_power
    internal: true
    restore_mode: ALWAYS_ON
    setup_priority: 1100     # before the GT911 initialises
  # Also set from the setup page; stored by sticky_device.h.
  - platform: template
    id: sleep_clock
    name: "Clock while asleep"
    icon: mdi:clock-outline
    entity_category: config
    # Never "restore": ESPHome's default (ALWAYS_OFF) runs the off action at
    # every boot, which turned the clock off at every wake from deep sleep.
    restore_mode: DISABLED
    lambda: 'return sticky::clock_on();'
    turn_on_action:
      - lambda: 'sticky::set_clock(true); id(sleep_clock).publish_state(true);'
    turn_off_action:
      - lambda: 'sticky::set_clock(false); id(sleep_clock).publish_state(false);'

deep_sleep:
  id: deep_sleep_ctl
  # USB plugged in while asleep wakes it and keeps it awake.
  wakeup_pin:
    number: GPIO9
    allow_other_uses: true
    mode: INPUT
  wakeup_pin_mode: KEEP_AWAKE
  # Any of the three buttons wakes it.
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - number: GPIO4
        allow_other_uses: true
      - number: GPIO5
        allow_other_uses: true
      - number: GPIO6
        allow_other_uses: true

# --- Battery ------------------------------------------------------------------------
# (Home Assistant values come from runtime subscriptions: sticky_device.h.)
sensor:
  - platform: template
    id: battery_level
    name: Battery
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: 60s
    # BQ27220 @0x55, StateOfCharge register 0x2C (little endian).
    lambda: |-
      uint8_t reg = 0x2C;
      uint8_t raw[2] = {0, 0};
      if (id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2) != esphome::i2c::ERROR_OK) return NAN;
      const uint16_t soc = raw[0] | (raw[1] << 8);
      return soc <= 100 ? (float) soc : NAN;
    on_value:
      - lambda: |-
          auto &m = remote_ui::model();
          if (std::isnan(m.battery) || (int) m.battery != (int) x) remote_ui::request();
          m.battery = x;

binary_sensor:
  - platform: gpio
    id: usb_power
    pin:
      number: GPIO9
      allow_other_uses: true
      mode: INPUT
    on_state:
      - lambda: |-
          remote_ui::model().usb = x;
          id(last_activity) = millis();
          remote_ui::request();

  # Physical buttons: AI/power = sleep now, up/down = volume.
  # A press that just woke the device only wakes it.
  - platform: gpio
    id: button_ai
    pin:
      number: GPIO4
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    on_multi_click:
      - timing:
          - ON for at most 1.5s
          - OFF for at least 50ms
        then:
          - lambda: |-
              id(last_activity) = millis();
              ESP_LOGI("buttons", "AI pressed (asleep %d, dozing %d)", remote_ui::model().sleeping, id(dozing));
              if (id(dozing) || remote_ui::model().sleeping) return id(wake_up).execute();
              if (millis() < 2000 || millis() - id(woke_at) < 1500) return;   // the press that woke it
              auto t = id(ha_time).now();
              remote_ui::handle_button(remote_ui::BTN_AI, t.is_valid() ? t.timestamp : 0,
                                       *remote_ui::actions());
      - timing:
          - ON for at least 1.5s
        then:
          - lambda: |-
              if (id(dozing) || remote_ui::model().sleeping) return id(wake_up).execute();
              if (millis() - id(woke_at) > 2500) id(go_to_sleep).execute();
  - platform: gpio
    id: button_up
    pin:
      number: GPIO5
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          id(last_activity) = millis();
          ESP_LOGI("buttons", "Up pressed");
          if (id(dozing) || remote_ui::model().sleeping) return id(wake_up).execute();
          if (millis() > 2000 && millis() - id(woke_at) > 1500)
            remote_ui::handle_button(remote_ui::BTN_UP, 0, *remote_ui::actions());
  - platform: gpio
    id: button_down
    pin:
      number: GPIO6
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          id(last_activity) = millis();
          ESP_LOGI("buttons", "Down pressed");
          if (id(dozing) || remote_ui::model().sleeping) return id(wake_up).execute();
          if (millis() > 2000 && millis() - id(woke_at) > 1500)
            remote_ui::handle_button(remote_ui::BTN_DOWN, 0, *remote_ui::actions());
    # Hold 3 s: touch calibration, in development builds only (touch_calibration).
    on_multi_click:
      - timing:
          - ON for at least 3s
        then:
          - lambda: |-
              id(last_activity) = millis();
              remote_ui::calib_start();

# --- Actions sent to Home Assistant -------------------------------------------------------
script:
  # The tick on each tap, at the Touch sound setting's level. A hardware timer
  # ends it, so it stays 25 ms even if the main loop is busy.
  - id: beep
    mode: restart
    then:
      - lambda: |-
          const uint8_t level = sticky::sound();
          if (level == 0) return;   // Off
          static esp_timer_handle_t off = nullptr;
          if (off == nullptr) {
            esp_timer_create_args_t args{};
            args.callback = [](void *) { id(buzzer).set_level(0.0f); };
            args.name = "beep_off";
            esp_timer_create(&args, &off);
          }
          esp_timer_stop(off);
          id(buzzer).set_level(level == 1 ? 0.06f : 0.5f);   // Quiet, Normal
          esp_timer_start_once(off, 25 * 1000);

  - id: toggle_light_1
    then:
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: !lambda "return sticky::settings().light1;"
  - id: toggle_light_2
    then:
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: !lambda "return sticky::settings().light2;"

  - id: atv_turn_on
    then:
      - homeassistant.action:
          action: media_player.turn_on
          data:
            entity_id: !lambda "return sticky::settings().player;"
  - id: atv_turn_off
    then:
      - homeassistant.action:
          action: media_player.turn_off
          data:
            entity_id: !lambda "return sticky::settings().player;"
  - id: atv_play_pause
    then:
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: !lambda "return sticky::settings().player;"
  - id: atv_seek
    parameters:
      pos: float
    then:
      - homeassistant.action:
          action: media_player.media_seek
          data:
            entity_id: !lambda "return sticky::settings().player;"
            seek_position: !lambda 'return esphome::to_string((int) pos);'
  # Remote keys (up/down/left/right/select/menu/home), and the skip fallback
  # when HA reports no position (skip_forward/backward: the app picks the step).
  - id: atv_remote
    mode: queued
    parameters:
      command: string
    then:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: !lambda "return sticky::settings().remote;"
            command: !lambda 'return command;'
  - id: atv_volume_up
    then:
      - homeassistant.action:
          action: media_player.volume_up
          data:
            entity_id: !lambda "return sticky::settings().player;"
  - id: atv_volume_down
    then:
      - homeassistant.action:
          action: media_player.volume_down
          data:
            entity_id: !lambda "return sticky::settings().player;"
  - id: atv_open_infuse
    then:
      - homeassistant.action:
          action: media_player.select_source
          data:
            entity_id: !lambda "return sticky::settings().player;"
            source: !lambda "return sticky::settings().app;"

  # Leave the "Asleep" face on the panel, then sleep. With the clock on (and
  # off USB, and set up), that is light sleep with a wake every minute to move
  # the clock; otherwise the power latch is frozen and it deep-sleeps.
  - id: go_to_sleep
    mode: single
    then:
      - lambda: |-
          remote_ui::model().sleeping = true;
          remote_ui::request(true);
      - wait_until:
          condition:
            lambda: 'return !remote_ui::redraw().dirty;'
          timeout: 5s
      - delay: 500ms
      - wait_until:
          condition:
            lambda: 'return !id(epd).is_updating();'
          timeout: 20s
      - lambda: |-
          ESP_LOGI("sleep", "Asleep face drawn (clock %d, USB %d, setup %d)", sticky::clock_on(),
                   id(usb_power).state, remote_ui::model().in_setup());
      - if:
          condition:
            lambda: 'return sticky::clock_on() && !remote_ui::model().in_setup() && !id(usb_power).state;'
          then:
            - logger.log: Dozing, with the clock
            - lambda: |-
                wifi::global_wifi_component->disable();
                id(dozing) = true;
          else:
            # On USB it can't deep-sleep: keep the face up and the buttons live
            # (hold_pins_for_sleep hands them to the RTC, where the firmware no
            # longer sees them) until the cable goes. A button press stops
            # this script (wake_up).
            - if:
                condition:
                  binary_sensor.is_on: usb_power
                then:
                  - logger.log: "On USB: showing the asleep face until unplugged or a button is pressed"
                  - wait_until:
                      binary_sensor.is_off: usb_power
            - logger.log: Going to deep sleep
            - lambda: |-
                id(deep_sleep_ctl).allow_deep_sleep();
                remote_ui::hold_pins_for_sleep();
            - deep_sleep.enter: deep_sleep_ctl

  # A button (or USB power) ended a doze, or the asleep face on USB, where
  # deep sleep waits for the cable to go: back to the live screen.
  - id: wake_up
    mode: single
    then:
      - script.stop: go_to_sleep
      - lambda: |-
          ESP_LOGI("sleep", "Awake again");
          id(deep_sleep_ctl).prevent_deep_sleep();   // a deep sleep waiting for USB to go stays cancelled
          remote_ui::release_sleep_holds();
          id(dozing) = false;
          id(woke_at) = millis();
          id(last_activity) = millis();
          id(last_online) = millis();
          remote_ui::model().sleeping = false;
          remote_ui::request(true);
          wifi::global_wifi_component->enable();

interval:
  # USB setup protocol: read the serial line often (its buffer is small).
  - interval: 10ms
    then:
      - lambda: 'sticky::poll();'

  # Refresh scheduler: one e-paper update at a time, only when the panel is idle.
  # Checked every 20 ms so a tap's feedback starts as soon as the panel is free.
  - interval: 20ms
    then:
      - lambda: |-
          // Dozing: once the clock is drawn, light-sleep until the next minute,
          // a button or USB power. A minute tick redraws (partial); the half
          // hours get a full refresh, which clears the ghost of old digits.
          if (id(dozing)) {
            if (id(epd).is_updating()) return;
            if (remote_ui::redraw().dirty) goto refresh;
            const auto woke = sticky::doze(600);
            if (woke == sticky::Woke::REJECTED || woke == sticky::Woke::OTHER) return;   // logged; doze again
            auto t = id(ha_time).now();
            if (woke != sticky::Woke::TIMER) return id(wake_up).execute();
            if (t.is_valid()) {
              char d[24];
              snprintf(d, sizeof d, "%d %d %d", t.day_of_week, t.day_of_month, t.month);
              remote_ui::apply("date", d);
              if (t.minute % 30 == 0) remote_ui::request(true);
            }
            remote_ui::minute_tick(t.is_valid(), t.hour, t.minute, t.timestamp);
            return;
          }
          // Hold to repeat: only while the touch controller still reports a finger.
          if (id(touch).get_touches().empty()) remote_ui::touch_released();
          remote_ui::hold_tick(*remote_ui::actions());
          remote_ui::feedback_tick();   // clears the pad's pressed look
          if (id(epd).is_updating()) return;
          refresh:
          bool full = false;
          if (!remote_ui::take_refresh(remote_ui::model(), full)) return;
          if (full) id(epd).request_full_update();
          id(epd).update();

  # Seek bar and clock move once a minute: redraw only when what is shown changes.
  - interval: 5s
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (t.is_valid()) {
            char d[24];
            snprintf(d, sizeof d, "%d %d %d", t.day_of_week, t.day_of_month, t.month);
            remote_ui::apply("date", d);
          }
          remote_ui::minute_tick(t.is_valid(), t.hour, t.minute, t.timestamp);
      # Put to sleep on USB, it stayed awake (USB wakes it); unplugged, it sleeps for real.
      - if:
          condition:
            lambda: 'return remote_ui::model().sleeping && !id(dozing) && !id(usb_power).state && !id(go_to_sleep).is_running();'
          then:
            - script.execute: go_to_sleep

  # Network state for the setup screens (connected, address, or nothing to
  # join). Not while asleep: Wi-Fi is off on purpose then.
  - interval: 1s
    then:
      - lambda: |-
          if (remote_ui::model().sleeping) return;
          auto *w = wifi::global_wifi_component;
          std::string ip;
          if (w->is_connected())
            for (auto &a : w->get_ip_addresses())
              if (a.is_set() && a.is_ip4()) {
                char buf[network::IP_ADDRESS_BUFFER_SIZE];
                ip = a.str_to(buf);
                break;
              }
          using remote_ui::Net;
          Net net = Net::CONNECTING;
          if (w->is_connected()) { net = Net::CONNECTED; id(last_online) = millis(); }
          else if (!w->has_sta() || w->get_sta().get_ssid() == "sticky-remote-no-network")
            net = Net::NO_NETWORK;   // only wifi-setup.yaml's placeholder: nothing real to join
          else if (millis() - id(last_online) > 90000) net = Net::UNREACHABLE;   // as the old hotspot timeout
          remote_ui::set_network(net, ip);

  # Sleep after a quiet spell, on battery only.
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              // Setup screens (Wi-Fi, pairing) get much longer: they need it awake.
              const auto &m = remote_ui::model();
              const uint32_t chosen = sticky::sleep_after_ms();   // 0: never by itself
              if (chosen == 0) return false;
              const uint32_t limit = m.in_setup() ? std::max<uint32_t>(chosen, ${setup_sleep_after_ms}) : chosen;
              return !id(usb_power).state && !m.sleeping && millis() - id(last_activity) > limit;
          then:
            - script.execute: go_to_sleep

# --- Artwork ---------------------------------------------------------------------------------
http_request:
  timeout: 10s
  # The proxy URL carries its own token; never follow a redirect elsewhere.
  follow_redirects: false

image:
  - platform: online_image
    id: poster
    # Only for artwork that isn't a JPEG: JPEGs load in a background task
    # (sticky_device.h). Set at runtime from the settings' HA address.
    url: http://127.0.0.1/
    format: AUTO
    type: GRAYSCALE
    resize: 98x146       # the artwork box (remote_ui::POSTER_W x POSTER_H)
    update_interval: never
    on_download_finished:
      - lambda: 'sticky::fallback_done(true);'
    on_error:
      - lambda: 'sticky::fallback_done(false);'

# --- Touch ------------------------------------------------------------------------------------
touchscreen:
  - platform: gt911
    id: touch
    i2c_id: i2c_touch
    display: epd
    interrupt_pin: GPIO21
    reset_pin: GPIO41
    transform:
      swap_xy: ${touch_swap_xy}
      mirror_x: ${touch_mirror_x}
      mirror_y: ${touch_mirror_y}
    on_release:
      - lambda: 'remote_ui::touch_released();'
    on_touch:
      - lambda: |-
          const uint32_t now_ms = millis();
          id(last_activity) = now_ms;
          ESP_LOGD("touch", "x=%d y=%d raw x=%d y=%d", touch.x, touch.y, touch.x_raw, touch.y_raw);
          if (now_ms - id(last_tap) < 150) return;   // debounce (quick repeats on the pad still count)
          id(last_tap) = now_ms;
          auto t = id(ha_time).now();
          remote_ui::handle_touch(touch.x_raw, touch.y_raw, touch.x, touch.y, t.is_valid() ? t.timestamp : 0,
                                  *remote_ui::actions());

