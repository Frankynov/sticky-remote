    glyphs: ["…·–"]
  - file: fonts/trmnl/TRMNL21-Bold.ttf
    id: r22
    size: 21
    glyphsets: [GF_Latin_Core]
    glyphs: ["…·–"]
  - file: fonts/trmnl/TRMNL12-Bold.ttf
    id: r26
    size: 24
    glyphsets: [GF_Latin_Core]
    glyphs: ["…·–"]
  - file: fonts/trmnl/TRMNL16-Bold.ttf
    id: r30
    size: 32
    glyphsets: [GF_Latin_Core]
    glyphs: ["…·–"]
  - file: fonts/materialdesignicons-webfont.ttf
    id: i24
    size: 24
    glyphs: ["\U000F05A9", "\U000F05AA", "\U000F040A", "\U000F03E4", "\U000F16C7"]  # wifi, wifi-off, play, pause, wifi-sync
  - file: fonts/materialdesignicons-webfont.ttf
    id: i40
    size: 40
    # vol -, vol +, power, sleep, back, tv, movie, play-pause, rewind-10, fast-forward-10
    glyphs: ["\U000F075E", "\U000F075D", "\U000F0425", "\U000F04B2", "\U000F17B3", "\U000F0502", "\U000F0FCF", "\U000F040E", "\U000F0D2A", "\U000F0D71"]
  - file: fonts/materialdesignicons-webfont.ttf
    id: i52
    size: 52
    # star, ceiling light, bulb, floor lamp (on/off each), power, play, pause
    glyphs: ["\U000F0AE2", "\U000F0AE3", "\U000F0769", "\U000F17C7", "\U000F0335", "\U000F0336", "\U000F08DD", "\U000F17C8", "\U000F0425", "\U000F040A", "\U000F03E4"]
  - file: fonts/materialdesignicons-webfont.ttf
    id: i64
    size: 64
    # rewind-10, fast-forward-10, chevron up/down/left/right
    glyphs: ["\U000F0D2A", "\U000F0D71", "\U000F0143", "\U000F0140", "\U000F0141", "\U000F0142"]
  - file: fonts/materialdesignicons-webfont.ttf
    id: i120
    size: 120
    glyphs: ["\U000F0FCF", "\U000F083B", "\U000F07D0", "\U000F04B2"]       # movie, tv-off, home-assistant, sleep
  # The sleep clock: digits only, one per typeface.
  - file: fonts/Inter-Bold.ttf
    id: clock_inter
    size: 144
    glyphs: ["0123456789:"]
  - file: fonts/trmnl/TRMNL16-Bold.ttf
    id: clock_trmnl
    size: 128
    glyphs: ["0123456789:"]

display:
  - platform: epaper_spi
    id: epd
    model: seeed-reterminal-sticky
    rotation: ${rotation}
    update_interval: never
    # Partial updates by default; the scheduler asks for a full one when the
    # layout changes, on new artwork, and every 20 partials.
    full_update_every: 255
    lambda: |-
      static const remote_ui::Fonts inter{id(t18), id(t20), id(t22), id(t26), id(t30),
                                          id(i24), id(i40), id(i52), id(i64), id(i120), id(clock_inter)};
      static const remote_ui::Fonts trmnl{id(r18), id(r20), id(r22), id(r26), id(r30),
                                          id(i24), id(i40), id(i52), id(i64), id(i120), id(clock_trmnl)};
      remote_ui::Ctx c{it, sticky::trmnl() ? trmnl : inter};
      c.gray4 = ${grayscale};
      auto t = id(ha_time).now();
      remote_ui::render(c, sticky::poster_image(), t.is_valid() ? t.timestamp : 0, t.is_valid(), t.hour, t.minute,
                        sticky::labels());
