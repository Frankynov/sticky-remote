    id: t20
    size: 20
    glyphsets: [GF_Latin_Core]
    glyphs: ["…·–"]
  - file: fonts/Inter-Bold.ttf
    id: t22
    size: 22
    glyphsets: [GF_Latin_Core]
    glyphs: ["…·–"]
  - file: fonts/Inter-Bold.ttf
    id: t26
    size: 26
    glyphsets: [GF_Latin_Core]
    glyphs: ["…·–"]
  - file: fonts/Inter-Bold.ttf
    id: t30
    size: 30
    glyphsets: [GF_Latin_Core]
